    <title>TinyLog</title>
    <style>.daylight #splash{color:#2a2420}</style>
    <script>
      (function () {
        try {
          var t = (JSON.parse(localStorage.getItem("tinylog.prefs.v1") || "{}").theme) || "system";
          var light = t === "light" || (t === "system" && matchMedia("(prefers-color-scheme: light)").matches);
          var r = document.documentElement;
          if (light) r.classList.add("daylight");
          r.style.colorScheme = light ? "light" : "dark";
          r.style.background = light ? "#f4efe6" : "#221e19";
          window.__startAt = Date.now();
        } catch (e) {}
      })();
    </script>
