<!doctype html>
<html lang="en" style="background:#221e19">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#221e19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TinyLog" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>TinyLog</title>
    <script>
      (function () {
        try {
          var t = (JSON.parse(localStorage.getItem("tinylog.prefs.v1") || "{}").theme) || "system";
          var light = t === "light" || (t === "system" && matchMedia("(prefers-color-scheme: light)").matches);
          var r = document.documentElement;
          if (light) r.classList.add("daylight");
          r.style.colorScheme = light ? "light" : "dark";
          r.style.background = light ? "#faf7f2" : "#221e19";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
